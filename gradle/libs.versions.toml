hilt = "2.57"
room = "2.6.1"
navigation = "2.8.4"
lifecycle = "2.8.7"
coroutines = "1.9.0"
fragmentKtx = "1.8.5"
recyclerview = "1.4.0"
cardview = "1.0.0"
coordinatorlayout = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
