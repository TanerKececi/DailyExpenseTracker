name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21, matching the version this project is developed against. Gradle 8.13's embedded
      # Kotlin DSL compiler cannot parse JDK 22+ version strings, so do not bump this casually.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      # The reports are the only useful artefact when something fails; the console output alone
      # rarely says which assertion broke.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
